<div class="carrusel"
     [class.fondo]="variante === 'fondo'"
     (mouseenter)="detenerAutoplay()"
     (mouseleave)="iniciarAutoplay()"
     (touchstart)="onTouchStart($event)"
     (touchend)="onTouchEnd($event)">

  <div class="carrusel-track" [style.transform]="'translateX(-' + (indiceActual() * 100) + '%)'">
    @for (imagen of imagenes; track imagen.src) {
      <div class="carrusel-slide">
        <img [src]="imagen.src" [alt]="imagen.alt" loading="lazy" [style.object-position]="imagen.posicion || 'center'">
        @if (variante === 'tarjeta') {
          <div class="carrusel-caption">{{ imagen.alt }}</div>
        }
      </div>
    }
  </div>

  @if (variante === 'tarjeta' && imagenes.length > 1) {
    <button type="button" class="carrusel-nav carrusel-nav-prev" (click)="anterior(); iniciarAutoplay()" aria-label="Imagen anterior">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button type="button" class="carrusel-nav carrusel-nav-next" (click)="siguiente(); iniciarAutoplay()" aria-label="Siguiente imagen">
      <i class="fas fa-chevron-right"></i>
    </button>

    <div class="carrusel-dots">
      @for (imagen of imagenes; track imagen.src; let i = $index) {
        <button type="button"
                class="carrusel-dot"
                [class.activo]="i === indiceActual()"
                (click)="irA(i); iniciarAutoplay()"
                [attr.aria-label]="'Ir a la imagen ' + (i + 1)"></button>
      }
    </div>
  }
</div>
